<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>光标位置测试</title>
    <style>
        body {
            background: #0a0a0a;
            color: #00ff00;
            font-family: 'Courier New', monospace;
            padding: 40px;
            font-size: 18px;
            line-height: 1.8;
        }
        
        #output {
            display: inline;
        }
        
        .typing-cursor {
            display: inline;
            margin-left: 2px;
            font-weight: bold;
            color: #00ff00;
            animation: blink 0.7s infinite;
        }
        
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
        
        .test-section {
            margin: 20px 0;
            padding: 20px;
            border: 1px solid #00ff00;
        }
    </style>
</head>
<body>
    <h1>光标位置测试</h1>
    
    <div class="test-section">
        <h2>测试 1: 光标在内容后面（正确）</h2>
        <span id="test1">
            这是一些文本内容
            <span class="typing-cursor">■</span>
        </span>
    </div>
    
    <div class="test-section">
        <h2>测试 2: 动态添加内容，光标应该始终在最后</h2>
        <span id="test2">
            <span class="typing-cursor">■</span>
        </span>
        <br><br>
        <button onclick="addText()">添加文本</button>
        <button onclick="clearText()">清空文本</button>
    </div>
    
    <div class="test-section">
        <h2>测试 3: 模拟打字效果</h2>
        <span id="test3">
            <span class="typing-cursor">■</span>
        </span>
        <br><br>
        <button onclick="startTyping()">开始打字</button>
    </div>
    
    <script>
        function addText() {
            var container = document.getElementById('test2');
            var cursor = container.querySelector('.typing-cursor');
            
            // 移除光标
            if (cursor) cursor.remove();
            
            // 添加文本
            var text = document.createTextNode('新添加的文本。');
            container.appendChild(text);
            
            // 重新添加光标到末尾
            if (cursor) container.appendChild(cursor);
        }
        
        function clearText() {
            var container = document.getElementById('test2');
            var cursor = container.querySelector('.typing-cursor');
            
            // 保存光标
            if (cursor) cursor.remove();
            
            // 清空
            container.innerHTML = '';
            
            // 添加回光标
            if (cursor) container.appendChild(cursor);
        }
        
        function startTyping() {
            var container = document.getElementById('test3');
            var cursor = container.querySelector('.typing-cursor');
            var text = "Hello, World! 这是模拟的打字效果。";
            var index = 0;
            
            // 移除光标
            if (cursor) cursor.remove();
            container.innerHTML = '';
            
            function typeChar() {
                if (index < text.length) {
                    var char = document.createTextNode(text.charAt(index));
                    container.appendChild(char);
                    index++;
                    setTimeout(typeChar, 50);
                } else {
                    // 打字完成，添加回光标
                    if (cursor) container.appendChild(cursor);
                }
            }
            
            typeChar();
        }
    </script>
    
    <div class="test-section">
        <h2>说明</h2>
        <p>光标（■）应该始终显示在文本内容的<strong>最后面</strong>，而不是前面。</p>
        <p>如果光标在文本前面，说明结构有问题。</p>
    </div>
</body>
</html>
