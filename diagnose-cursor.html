<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>光标诊断工具</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #f5f5f5;
        }
        .diagnostic {
            background: white;
            padding: 20px;
            margin: 10px 0;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .success { color: green; }
        .error { color: red; }
        .warning { color: orange; }
        pre {
            background: #f0f0f0;
            padding: 10px;
            border-radius: 3px;
            overflow-x: auto;
        }
        button {
            background: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover {
            background: #0056b3;
        }
    </style>
</head>
<body>
    <h1>🔍 光标诊断工具</h1>
    
    <div class="diagnostic">
        <h2>预览测试</h2>
        <p>下面应该显示一个闪烁的光标：</p>
        <div style="background: #0a0a0a; padding: 20px; color: #00ff00; font-family: 'Courier New', monospace;">
            测试文本<span class="typing-cursor" style="animation: blink 0.7s infinite;">■</span>
        </div>
    </div>
    
    <div class="diagnostic">
        <h2>开始诊断</h2>
        <button onclick="runDiagnostics()">运行完整诊断</button>
        <button onclick="openIndexPage()">打开 index.html 并诊断</button>
    </div>
    
    <div id="results"></div>
    
    <style>
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
    </style>
    
    <script>
        function log(message, type = 'info') {
            const results = document.getElementById('results');
            const div = document.createElement('div');
            div.className = 'diagnostic';
            div.innerHTML = `<span class="${type}">${message}</span>`;
            results.appendChild(div);
        }
        
        function runDiagnostics() {
            document.getElementById('results').innerHTML = '';
            log('开始诊断...', 'info');
            
            // 检查光标元素
            const cursor = document.querySelector('.typing-cursor');
            if (cursor) {
                log('✓ 找到光标元素', 'success');
                log(`光标内容: "${cursor.textContent}"`, 'info');
                
                const styles = window.getComputedStyle(cursor);
                log(`<pre>display: ${styles.display}
opacity: ${styles.opacity}
color: ${styles.color}
animation: ${styles.animation}
font-weight: ${styles.fontWeight}</pre>`, 'info');
                
                const rect = cursor.getBoundingClientRect();
                log(`<pre>位置: 
  top: ${rect.top}px
  left: ${rect.left}px
  width: ${rect.width}px
  height: ${rect.height}px</pre>`, 'info');
                
                if (styles.display === 'none') {
                    log('✗ 光标被隐藏 (display: none)', 'error');
                } else if (parseFloat(styles.opacity) === 0) {
                    log('✗ 光标完全透明 (opacity: 0)', 'error');
                } else if (rect.width === 0 || rect.height === 0) {
                    log('✗ 光标尺寸为 0', 'error');
                } else {
                    log('✓ 光标样式正常', 'success');
                }
            } else {
                log('✗ 未找到光标元素 (.typing-cursor)', 'error');
            }
            
            // 检查 CSS 文件
            log('<h3>已加载的样式表:</h3>', 'info');
            let foundTypingCSS = false;
            for (let i = 0; i < document.styleSheets.length; i++) {
                const sheet = document.styleSheets[i];
                const href = sheet.href || '(内联样式)';
                log(`${i + 1}. ${href}`, 'info');
                if (href.includes('typing.css')) {
                    foundTypingCSS = true;
                }
            }
            
            if (foundTypingCSS) {
                log('✓ typing.css 已加载', 'success');
            } else {
                log('⚠ 未找到 typing.css', 'warning');
            }
            
            log('诊断完成！', 'success');
        }
        
        function openIndexPage() {
            const win = window.open('index.html', '_blank');
            setTimeout(() => {
                if (win) {
                    log('已打开 index.html，正在诊断...', 'info');
                    setTimeout(() => {
                        try {
                            const cursor = win.document.querySelector('.typing-cursor');
                            if (cursor) {
                                const styles = win.window.getComputedStyle(cursor);
                                log('✓ 在 index.html 中找到光标', 'success');
                                log(`<pre>display: ${styles.display}
opacity: ${styles.opacity}
color: ${styles.color}</pre>`, 'info');
                            } else {
                                log('✗ 在 index.html 中未找到光标', 'error');
                            }
                        } catch(e) {
                            log('无法访问 index.html 内容（可能是跨域限制）', 'warning');
                            log('请手动在 index.html 中按 F12 打开控制台，执行以下代码：', 'info');
                            log(`<pre>var cursor = document.querySelector('.typing-cursor');
console.log('光标元素:', cursor);
console.log('display:', window.getComputedStyle(cursor).display);
console.log('opacity:', window.getComputedStyle(cursor).opacity);</pre>`, 'info');
                        }
                    }, 2000);
                }
            }, 500);
        }
        
        // 页面加载时自动运行诊断
        window.onload = function() {
            runDiagnostics();
        };
    </script>
</body>
</html>
