<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>配置测试</title>
    <script src="./config.js"></script>
</head>
<body>
    <h1>TerminalConfig 配置测试</h1>
    <pre id="output"></pre>
    
    <script>
        var output = document.getElementById('output');
        
        if (typeof window.TerminalConfig === 'undefined') {
            output.textContent = '❌ 错误：TerminalConfig 未定义！\n\n请检查 config.js 是否正确加载。';
        } else {
            var config = window.TerminalConfig;
            output.textContent = '✅ TerminalConfig 加载成功！\n\n' +
                '配置内容：\n' +
                JSON.stringify(config, null, 2) + '\n\n' +
                '关键配置：\n' +
                '- typing.enabled: ' + config.typing?.enabled + '\n' +
                '- matrix.enabled: ' + config.matrix?.enabled + '\n' +
                '- meta.title: ' + config.meta?.title + '\n';
        }
    </script>
</body>
</html>
