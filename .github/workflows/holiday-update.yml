name: Update Holiday Calendar

on:
  schedule:
    # 每天 UTC 16:01 = 北京时间 次日 00:01
    - cron: "1 16 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: holiday-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install fonttools brotli

      - name: Generate holiday SVG
        run: python3 holiday/generate-holiday-svg.py

      - name: Update README ?v= cache-buster
        run: |
          TS=$(date +%Y%m%d)
          sed -i "s|holiday-calendar.svg?v=[0-9]*|holiday-calendar.svg?v=${TS}|" README.md
          echo "🔄 README ?v= 更新为 ${TS}"

      - name: Check for changes
        id: changes
        run: |
          git diff --stat
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "📭 无变化，跳过提交"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "📝 检测到变化，准备提交"
          fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add holiday/holiday-calendar.svg holiday/cache/ README.md
          git commit -m "chore: update holiday calendar $(date +%Y-%m-%d)"
          git push origin master

      - name: Purge jsDelivr CDN
        if: steps.changes.outputs.changed == 'true'
        run: |
          curl -s "https://purge.jsdelivr.net/gh/hoochanlon/hoochanlon@master/holiday/holiday-calendar.svg" \
            | grep -q '"status": "finished"' \
            && echo "✅ jsDelivr CDN 已刷新" \
            || echo "⚠️  purge 未完成，可能需要手动刷新"

      - name: Summary
        run: |
          echo "### 📅 节假日日历更新" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.changes.outputs.changed }}" = "true" ]; then
            echo "✅ SVG 已更新并推送到 master" >> "$GITHUB_STEP_SUMMARY"
            echo "🚀 将触发 Hugo 构建部署" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "✅ 日历已是最新，无需更新" >> "$GITHUB_STEP_SUMMARY"
          fi
