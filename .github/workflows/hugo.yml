name: Deploy Hugo site to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  refresh-holiday:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install fonttools brotli

      - name: Refresh holiday SVG
        run: python3 holiday/generate-holiday-svg.py

      - name: Commit and push if changed
        if: github.actor != 'github-actions[bot]'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "📭 日历已是最新，无需提交"
          else
            git add holiday/holiday-calendar.svg holiday/cache/
            git commit -m "chore: refresh holiday calendar $(date +%Y-%m-%d)"
            git push origin master
            echo "📤 日历已刷新并推送"
          fi

  build:
    needs: refresh-holiday
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.164.0
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Hugo
        run: |
          wget -q -O "${{ runner.temp }}/hugo.deb" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "${{ runner.temp }}/hugo.deb"

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build site
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
        run: hugo --gc --minify

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  purge-cdn:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Purge jsDelivr CDN for holiday SVG
        run: |
          curl -s "https://purge.jsdelivr.net/gh/hoochanlon/hoochanlon@master/holiday/holiday-calendar.svg" \
            | grep -q '"status": "finished"' \
            && echo "✅ jsDelivr CDN 已刷新" \
            || echo "⚠️  purge 未完成"
